name: Draft release for Signum Node

on:
  push:
    tags:
      - 'v*'

# create-release needs to write the draft release + upload assets.
permissions:
  contents: write

jobs:
  build-node:
    name: Build and Package
    runs-on: windows-latest
    env:
      REF_NAME: ${{ github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        shell: bash
        run: |
          echo "VERSION=$REF_NAME"
          echo "VERSION=$REF_NAME" >> "$GITHUB_ENV"

      - name: Show version
        shell: bash
        run: echo "Version is $VERSION"

      - name: Extract release notes
        id: notes
        shell: bash
        run: |
          TAG="$REF_NAME"   # e.g. v3.9.12
          # Pull the section starting at "## <TAG>" up to the next "## " heading.
          SECTION=$(awk -v tag="## ${TAG} " '
            $0 ~ "^"tag {flag=1; next}
            /^## / {flag=0}
            flag {print}
          ' CHANGELOG.md)
          if [ -z "$SECTION" ]; then
            SECTION="See CHANGELOG.md for details."
          fi
          if printf '%s' "$SECTION" | grep -q "Hard Fork"; then
            echo "is_hf=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_hf=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "body<<RELEASE_NOTES_EOF"
            printf '%s\n' "$SECTION"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update Wallets
        shell: bash
        run: |
          cd ./ci
          ./updatePhoenix.sh
          ./updateClassic.sh

      - name: Set up Java 21 (Zulu)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build artifacts
        run: ./gradlew unzipWindowsJDK shadowJar jpackageWin zipWinExe release -PreleaseBuild

      - name: Create GitHub Release Draft
        id: create_release
        uses: actions/create-release@v1.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: ${{ steps.notes.outputs.is_hf == 'true' && format('⚠️ Hard Fork — Signum Node {0}', github.ref_name) || format('Signum Node {0}', github.ref_name) }}
          body: ${{ steps.notes.outputs.body }}
          draft: true
          prerelease: false

      - name: Upload - signum-node.zip
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./build/distributions/signum-node.zip
          asset_name: signum-node-${{ env.VERSION }}.zip
          asset_content_type: application/zip

      - name: Upload - signum-node-win_x64.zip
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./build/distributions/signum-node-win_x64.zip
          asset_name: signum-node-${{ env.VERSION }}-win_x64.zip
          asset_content_type: application/zip
